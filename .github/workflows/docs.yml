name: docs

# Mọi thay đổi chạm vào tài liệu, script dựng, hoặc PDF đều phải qua ba cổng:
#   1. liên kết nội bộ không chết        (check_docs_links.py)
#   2. số liệu tái lập được              (verify_protocol_math.py)
#   3. deck khớp với yellow paper        (check_pitch_deck.py --with-verifier)
# và một cổng thứ tư chỉ chạy khi PDF bị sửa: dựng lại phải ra đúng byte đã commit.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - "llms.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Kiểm chứng số liệu & liên kết
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài phụ thuộc kiểm chứng
        run: |
          python -m pip install --upgrade pip
          # check_pitch_deck.py đọc text layer của deck để đối chiếu chuỗi bắt buộc
          pip install pypdf

      - name: Liên kết nội bộ & chỉ mục
        run: python3 scripts/check_docs_links.py

      - name: Số liệu giao thức (S1–S9 + fuzz)
        run: python3 scripts/verify_protocol_math.py

      - name: Deck ↔ Yellow Paper
        run: python3 scripts/check_pitch_deck.py --with-verifier

      - name: Suy giảm PoP score (11 bất biến)
        run: python3 scripts/verify_pop_decay.py --quiet

      # Cổng thứ năm: biến quy ước văn xuôi trong AGENTS.md thành kiểm tự động
      # (docs/22 A1, docs/24 §4). Sáu nhóm: dòng nhận diện tài liệu, `CREATE TABLE`
      # = 34, từ cấm, thứ bậc nguồn, chỉ mục README/llms.txt, dấu vết soạn thảo.
      # Chạy TRƯỚC các cổng nặng vì nó rẻ và bắt lỗi biên tập sớm.
      - name: Quy ước AGENTS.md (6 nhóm, do máy canh)
        run: python3 scripts/check_agent_rules.py

      # Sinh câu hỏi cho 6 cổng HITL từ docs/PRD.md §0. KHÔNG gọi mạng:
      # cổng CI phải tất định, nên phần "advisory" chỉ kiểm ba bất biến offline.
      - name: Câu hỏi cổng HITL (offline, 3 bất biến)
        run: python3 scripts/gate_decide.py --self-test

      # Cổng thứ bảy: bản ghi niềm tin của dự án (docs/26, lấy từ Proactive-Co-Creator).
      # `--tick` so từng giá trị trong pm/spec-*.json với ĐÚNG dòng nguồn trong docs/;
      # `--self-test` kiểm 4 bất biến (source · không hỏi lại · không mâu thuẫn · có đường thoát).
      # Không gọi mạng: chỉ đọc tệp.
      - name: Bản ghi niềm tin P01 (16 giá trị · 4 bất biến)
        run: python3 scripts/check_specs.py --tick && python3 scripts/check_specs.py --self-test

      # Cổng thứ tám: hợp đồng @game9k/game-sdk (docs/27). Kiểm 5 hàm Poki còn đủ
      # trong docs/03 §3, SDK không gọi mạng / không chạm thanh toán, và ngân sách
      # 12 KB gzip của FR-SDK-01 được ĐO chứ không chỉ hứa. Không gọi mạng.
      - name: Hợp đồng SDK game-sdk (5 bất biến · ngân sách 12 KB)
        run: python3 scripts/check_sdk.py --selftest

      # Cổng thứ chín: hợp đồng SDK đã KHOÁ chưa (docs/28). check_sdk.py kiểm hợp đồng
      # hiện tại; cổng này kiểm nó không đổi lặng lẽ: khoá ↔ mã ↔ docs/03 §3, và
      # không có dist/*.min.js trong git (bài học từ repo splice).
      - name: Khoá hợp đồng SDK (5 bất biến · hash bề mặt)
        run: python3 scripts/check_sdk_drift.py

      # Cổng thứ mười: bảng lỗi SDK khớp hợp đồng (docs/29). Bắt đúng loại hỏng
      # mà docs/29 tìm ra: `send()` từng trả resolve(null) nên mọi kiểu hỏng
      # thành "không biết"; và mã lỗi đổi ở CHỖ GỌI mà không khai.
      - name: Mã lỗi SDK khớp hợp đồng (4 bất biến)
        run: python3 scripts/check_sdk_errors.py --selftest

      # Cổng thứ mười một: khoá xuất mạng (docs/30). `AGENTS.md` gọi cổng là "tất định
      # byte-for-byte" nhưng thứ chứng minh điều đó từng là hai CI run xanh. Cổng này
      # đọc mã: không HTTP client trong scripts/, không dịch vụ AI trong workflow.
      - name: Khoá xuất mạng (4 bất biến · không HTTP client)
        run: python3 scripts/check_egress_lock.py --selftest

      # Cổng thứ mười hai: 6 cổng HITL có đúng là một THANG không (docs/31).
      # "Trượt bài dễ thì không qua bài khó" — nên thứ tự bài kiểm là một phần của
      # bài kiểm. Đọc tiêu chí trực tiếp từ docs/PRD.md §0, không có bản sao.
      - name: Thang 6 cổng HITL (4 bất biến · 20 hạng mục)
        run: python3 scripts/check_gate_ladder.py --selftest

      # Cổng thứ mười ba: hồ sơ chứng cứ của gói SDK (docs/32). docs/28 và docs/29
      # từng KHÔNG thuộc cổng nào — nên khi SDK lên 0.2.0, docs/28 vẫn ghi hash 0.1.x
      # mà không ai báo. Cổng này quét docs/ tìm hash + phiên bản lạc hậu.
      - name: Hồ sơ chứng cứ SDK (5 bất biến · hash + phiên bản trong docs/)
        run: python3 scripts/check_sdk_manifest.py --selftest

      # Cổng thứ mười bốn: loại của từng câu tuyên bố (docs/33). AGENTS.md cấm HỨA HẸN
      # nhưng chưa cấm TUYÊN BỐ VỀ THẾ GIỚI — và câu "chưa ai làm" là câu sai được,
      # kiểm được, và làm yếu mọi con số khác trong cùng tài liệu.
      - name: Phân loại tuyên bố (5 bất biến · sổ đăng ký)
        run: python3 scripts/check_claims.py --selftest

      # Cổng thứ mười lăm: biên bản đo (docs/35). Một con số không kèm điều kiện đo thì
      # không kiểm toán được — và bất biến 5 kiểm đúng lỗi "đo trên tệp đã bị đột biến".
      - name: Biên bản đo (6 bất biến · khoá model, phiên bản)
        run: python3 scripts/receipt_lock.py --selftest

      # Cổng thứ mười sáu: bốn bổ đề của nguyên lý đơn vị (docs/36). Tái lập số đã
      # công bố của CẢ HAI hồ sơ bằng một đường tính độc lập với verify_protocol_math,
      # và kiểm (★) trên toàn miền tham số thay vì điểm mặc định.
      - name: Bốn bổ đề KVU (6 bất biến · biên + tái lập số đã công bố)
        run: python3 scripts/kvu_invariants.py --selftest

  reproducible-pdf:
    name: PDF dựng lại phải trùng byte đã commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài phụ thuộc dựng PDF (ghim phiên bản)
        run: |
          python -m pip install --upgrade pip
          # Phiên bản phải ghim: reportlab quyết định cách nén & sắp object
          # trong PDF, fontTools quyết định byte của bộ font dẫn xuất. Đổi
          # phiên bản minor là md5 đổi — đó là điều job này canh.
          pip install \
            reportlab==5.1.0 \
            fonttools==4.68.0 \
            pypdf==7.1.1 \
            pypdfium2==5.15.2

      - name: Cài font nguồn (ghim phiên bản)
        run: |
          # Phiên bản phải ghim: PDF chỉ tất định khi bộ font là tất định.
          npm install --no-audit --no-fund \
            @fontsource/noto-sans@5.3.0 \
            @fontsource/noto-sans-mono@5.3.0 \
            dejavu-fonts-ttf@2.37.3

      - name: Dựng lại bốn PDF vào thư mục tạm
        run: |
          set -euo pipefail
          mkdir -p /tmp/rebuild
          export XDG_CACHE_HOME=/tmp/fontcache
          python scripts/build_pitch_deck.py /tmp/rebuild/deck.pdf
          python scripts/build_whitepaper_pdf.py docs/WHITEPAPER.md /tmp/rebuild/wp.pdf
          python scripts/build_legal_brief.py /tmp/rebuild/legal.pdf
          python scripts/build_claims_register.py /tmp/rebuild/claims.pdf
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import build_whitepaper_pdf as B
          B.build(
              "docs/YELLOWPAPER.md",
              "/tmp/rebuild/yp.pdf",
              "Game9K Yellow Paper v1.0",
              "Formal Specification — Version-Synced Game Capital Formation",
              kicker="YELLOW PAPER",
              paper_label="Yellow Paper v1.0",
              running_tagline="Formal Specification — Version-Synced Game Capital Formation",
          )
          PY

      - name: Builder phải tất định trong CÙNG môi trường (2 cache font độc lập)
        run: |
          set -euo pipefail
          # Phân biệt hai loại lỗi rất khác nhau:
          #   (a) builder không tất định  -> bước này bắt được
          #   (b) môi trường khác nhau    -> bước md5 bên dưới bắt được
          # Nếu (a) đỏ thì lỗi ở code; nếu chỉ (b) đỏ thì lỗi ở toolchain/font.
          for d in /tmp/cacheA /tmp/cacheB; do
            mkdir -p "$d"
            GAME9K_FONT_REBUILD=1 XDG_CACHE_HOME="$d" \
              python scripts/build_pitch_deck.py "$d/deck.pdf"
            GAME9K_FONT_REBUILD=1 XDG_CACHE_HOME="$d" \
              python scripts/build_whitepaper_pdf.py docs/WHITEPAPER.md "$d/wp.pdf"
            GAME9K_FONT_REBUILD=1 XDG_CACHE_HOME="$d" \
              python scripts/build_legal_brief.py "$d/legal.pdf"
            GAME9K_FONT_REBUILD=1 XDG_CACHE_HOME="$d" \
              python scripts/build_claims_register.py "$d/claims.pdf"
            GAME9K_FONT_REBUILD=1 XDG_CACHE_HOME="$d" python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import build_whitepaper_pdf as B
          B.build("docs/YELLOWPAPER.md", os.path.join(os.environ["XDG_CACHE_HOME"], "yp.pdf"),
                  "Game9K Yellow Paper v1.0",
                  "Formal Specification — Version-Synced Game Capital Formation",
                  kicker="YELLOW PAPER", paper_label="Yellow Paper v1.0",
                  running_tagline="Formal Specification — Version-Synced Game Capital Formation")
          PY
          done
          fail=0
          for k in deck wp yp legal claims; do
            a=$(md5sum "/tmp/cacheA/$k.pdf" | cut -d' ' -f1)
            b=$(md5sum "/tmp/cacheB/$k.pdf" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "::error::builder KHÔNG tất định: $k ($a vs $b)"
              fail=1
            else
              echo "OK  $k  tất định  $a"
            fi
          done
          exit $fail

      - name: So md5 với bản đã commit (5 tệp)
        run: |
          set -euo pipefail
          fail=0
          for pair in "deck:docs/Game9K-Pitch-Deck.pdf" \
                      "wp:docs/Game9K-Whitepaper-v1.5.pdf" \
                      "yp:docs/Game9K-Yellow-Paper-v1.0.pdf" \
                      "legal:docs/Game9K-Legal-Brief-VN.pdf" \
                      "claims:docs/Game9K-Claims-Register.pdf"; do
            k="${pair%%:*}"; f="${pair#*:}"
            a=$(md5sum "$f" | cut -d' ' -f1)
            b=$(md5sum "/tmp/rebuild/$k.pdf" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "::error file=$f::$f không tất định — dựng lại cho md5 khác ($a vs $b)"
              fail=1
            else
              echo "OK  $f  $a"
            fi
          done
          exit $fail

      - name: Không còn macro LaTeX thô trong bản in
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          BAD = ["texttt", "leftarrow", "mathcal", "begin{cases", "blacksquare",
                 "triangleq", "dfrac", "lvert", "rvert", "mathsf", "mathrm",
                 r"\text", r"\implies"]
          bad = 0
          for f in ("docs/Game9K-Yellow-Paper-v1.0.pdf",
                    "docs/Game9K-Whitepaper-v1.5.pdf",
                    "docs/Game9K-Pitch-Deck.pdf",
                    "docs/Game9K-Legal-Brief-VN.pdf",
                    "docs/Game9K-Claims-Register.pdf"):
              r = PdfReader(f)
              text = " ".join((p.extract_text() or "") for p in r.pages)
              hits = [b for b in BAD if b in text]
              if hits:
                  print(f"::error file={f}::macro LaTeX lọt ra bản in: {hits}")
                  bad = 1
              else:
                  print(f"OK  {f} ({len(r.pages)} trang)")
          raise SystemExit(bad)
          PY
